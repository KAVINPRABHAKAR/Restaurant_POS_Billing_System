<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e1e2f, #2d2d44); height: 100vh; display: flex; align-items: center; }
        .login-card { border-radius: 15px; background: #ffffff; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="login-card text-center">
                    <h2 class="fw-bold mb-4">RESTAURANT POS</h2>
                    <p class="text-muted mb-4">Please enter your credentials to continue</p>
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger small">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3 text-start">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Cashier ID" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label">Password / PIN</label>
                            <input type="password" name="password" class="form-control" placeholder="••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">LOGIN TO SYSTEM</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
